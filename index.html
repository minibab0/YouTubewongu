<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>고양이 마리오 🐱</title>
<style>
  :root{
    --w:min(100vw, calc((100vh - 130px) * 1.6667), 960px);
    --w:min(100vw, calc((100dvh - 130px) * 1.6667), 960px);
  }
  html,body{margin:0;height:100%;background:#15142e;color:#fff;overflow:hidden;
    font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  #wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
  #screen{width:var(--w);aspect-ratio:5/3;border:4px solid #2c2a5c;border-radius:8px;box-sizing:border-box;background:#000;overflow:hidden}
  canvas{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
  #pad{width:var(--w);display:flex;justify-content:space-between;align-items:center}

  .pb{width:76px;height:62px;font-size:28px;line-height:1;border:0;border-radius:14px;background:#3d3b7d;color:#fff;
      box-shadow:0 5px 0 #25234f;touch-action:none;cursor:pointer;font-family:inherit}
  .pb.on{transform:translateY(3px);box-shadow:0 2px 0 #25234f;background:#5b58b4}
  #bJ{width:128px;font-size:20px;font-weight:700;background:#e0506f;box-shadow:0 5px 0 #8f2842}
  #bJ.on{background:#ff6f8d;box-shadow:0 2px 0 #8f2842}
  #bM{width:46px;height:40px;font-size:18px;border-radius:10px;opacity:.8}
  #help{margin:0;font-size:13px;color:#b9b7e6;text-align:center;padding:0 8px}
  @media (max-height:520px){#help{display:none}}

/* =====================================================================

/* =====================================================================
   1. 도트 그래픽 (문자열로 그린 픽셀 스프라이트)
   ===================================================================== */
function mk(w, h, fn) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  fn(c.getContext('2d'), c); return c;
}
function spr(rows, pal) {
  const h = rows.length, w = Math.max(...rows.map(r => r.length));
  return mk(w, h, x => {
    rows.forEach((r, j) => {
      for (let i = 0; i < r.length; i++) {
        const p = pal[r[i]];
        if (p) { x.fillStyle = p; x.fillRect(i, j, 1, 1); }
      }
    });
  });
}

/* --- 고양이 (주황 치즈냥이: 크림색 배, 분홍 코/귀) --- */
const CAT_PAL = { k:'#4a2c2a', o:'#f7a94b', d:'#e0762c', c:'#fff1d8', p:'#ff8fb1' };
const BODY = s => ('.k' + s + 'k').padEnd(16, '.');
const CAT_TOP = [
  ".........k....k.",
  "........kpk..kpk",
  "kkk.....kooooook",
  "kok.....kodoodok",
  "kok.....kokookok",
  "kok.....kokookok",
  "kok.....kcccpcck",
  'ko' + 'k'.repeat(13) + '.',
  BODY('oddoddooooo')
];
const BELLY1 = BODY('ooooccccooo'), BELLY2 = BODY('oooccccccoo');
const CAT_BOT = '.' + 'k'.repeat(13) + '..';
const LEGS_A = ["..kook...kook...","..kook...kook...","..kcck...kcck...","..kkkk...kkkk..."];
const LEGS_B = ["...kook.kook....","...kook.kook....","...kcck.kcck....","...kkkk.kkkk...."];
const LEGS_J = [".kook.....kook..",".kcck.....kcck..",".kkkk.....kkkk..","................"];
function catSet(big) {
  const body = big ? [BELLY1,BELLY1,BELLY1,BELLY1,BELLY2,BELLY2,BELLY2,BELLY2] : [BELLY1, BELLY2];
  const mkc = legs => spr([...CAT_TOP, ...body, CAT_BOT, ...legs], CAT_PAL);
  return { A: mkc(LEGS_A), B: mkc(LEGS_B), J: mkc(LEGS_J) };
}

/* =====================================================================
   2. 글씨 (3x5 도트 폰트)
   ===================================================================== */
const F = {};
const gl = (c, a, b, d, e, f) => { F[c] = a + b + d + e + f; };
gl('A','010','101','111','101','101'); gl('B','110','101','110','101','110');
gl('C','011','100','100','100','011'); gl('D','110','101','101','101','110');
gl('E','111','100','110','100','111'); gl('F','111','100','110','100','100');
gl('G','011','100','101','101','011'); gl('H','101','101','111','101','101');
gl('I','111','010','010','010','111'); gl('J','001','001','001','101','010');
gl('K','101','101','110','101','101'); gl('L','100','100','100','100','111');
gl('M','101','111','111','101','101'); gl('N','110','101','101','101','101');
gl('O','010','101','101','101','010'); gl('P','110','101','110','100','100');

gl('8','111','101','111','101','111'); gl('9','111','101','111','001','110');
gl('!','010','010','010','000','010'); gl(':','000','010','000','010','000');
gl('-','000','000','111','000','000'); gl('.','000','000','000','000','010');

function txt(s, x, y, sc = 1, col = '#fff', al = 'l') {
  s = String(s).toUpperCase();
  const w = s.length * 4 * sc - sc;
  if (al === 'c') x -= w / 2; else if (al === 'r') x -= w;
  x = Math.round(x); y = Math.round(y);
  const so = sc >= 3 ? 2 : 1;
  for (const [ox, oy, c] of [[so, so, '#000'], [0, 0, col]]) {
    ctx.fillStyle = c;
    for (let i = 0; i < s.length; i++) {
      const f = F[s[i]]; if (!f) continue;
      for (let k = 0; k < 15; k++) if (f[k] === '1')
        ctx.fillRect(x + ox + i * 4 * sc + (k % 3) * sc, y + oy + ((k / 3) | 0) * sc, sc, sc);
    }
  }
  return w;
}

/* =====================================================================
   3. 소리 (WebAudio 효과음)
   ===================================================================== */
let AC = null, muted = false;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f, d, type = 'square', v = 0.05, to = null, delay = 0) {
  if (!AC) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (to) o.frequency.exponentialRampToValueAtTime(to, t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d + 0.03);
}
const arp = (fs, d = 0.09, type = 'square', v = 0.045) => fs.forEach((f, i) => tone(f, d, type, v, null, i * d * 0.8));
const SFX = {

};
const sfx = n => { if (!muted) { try { SFX[n](); } catch (e) {} } };

/* =====================================================================

const kb = {}, pad = {};

  ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right',
  Space:'jump', ArrowUp:'jump', KeyW:'jump', KeyZ:'jump', Enter:'jump'
};
addEventListener('keydown', e => {
  ac();
  if (e.code === 'KeyM') { toggleMute(); return; }
  const k = KEYMAP[e.code]; if (!k) return;
  e.preventDefault();
  if (k === 'jump' && !kb.jump) jumpBuf = 8;
  kb[k] = true;
});
addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) { e.preventDefault(); kb[k] = false; } });
addEventListener('blur', () => { for (const k in kb) kb[k] = false; for (const k in pad) pad[k] = false; });

function bindBtn(id, key) {
  const b = document.getElementById(id);
  const down = e => { e.preventDefault(); ac(); try { b.setPointerCapture(e.pointerId); } catch (_) {}
    pad[key] = true; b.classList.add('on'); if (key === 'jump') jumpBuf = 8; };
  const up = e => { e.preventDefault(); pad[key] = false; b.classList.remove('on'); };
  b.addEventListener('pointerdown', down);
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(n => b.addEventListener(n, up));
  b.addEventListener('contextmenu', e => e.preventDefault());
}
bindBtn('bL', 'left'); bindBtn('bR', 'right'); bindBtn('bJ', 'jump');

function toggleMute() { muted = !muted; bM.textContent = muted ? '🔇' : '🔊'; }

              ['g',78],['k',82],['g',85],['g',96],['g',100],['k',104],['g',115],['g',120],['k',124],
              ['g',136],['g',140],['k',146],['g',150],['g',154]]
  }
];

const THEMES = [
  { sky:['#5ec2ff','#78cdff','#94d9ff','#b2e5ff'], hill1:'#5fcf66', hill2:'#86dd8c',
    orb:{ x:268, y:30, r:11, c:'#fff08a' }, stars:false },
  { sky:['#7a5bb5','#c8629a','#ff8f7a','#ffc27a'], hill1:'#8f4a86', hill2:'#b86a97',
    orb:{ x:230, y:128, r:26, c:'#ffe6a6' }, stars:false },
  { sky:['#0d1233','#161d4a','#222d66','#2f3f84'], hill1:'#1a3a4a', hill2:'#234c63',
    orb:{ x:268, y:30, r:12, c:'#fff7cf' }, stars:true }
];

/* =====================================================================
   6. 게임 상태
   ===================================================================== */
let state = 'title';          // title | intro | play | dying | clear | over | win
let lvIdx = 0, lives = START_LIVES, score = 0, tick = 0;
let LV, P, enemies = [], items = [], parts = [], bumps = {}, camX = 0;
let stateT = 0, dieT = 0, clearT = 0;

const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const addScore = n => { score += n; };

function loadLevel(i) {
  const d = LEVELS[i];
  const g = Array.from({ length: ROWS }, () => new Array(d.len).fill(0));
  d.ground.forEach(([a, b]) => { for (let c = a; c <= b; c++) { g[10][c] = 1; g[11][c] = 1; } });
  d.blocks.forEach(([c, r, t]) => { g[r][c] = t; });
  d.stairs.forEach(([s, n]) => { for (let k = 0; k < n; k++) for (let h = 1; h <= k + 1; h++) g[10 - h][s + k] = 6; });
  LV = { len: d.len, g, theme: d.theme, flag: d.flag };
  enemies = d.enemies.map(([t, c]) => mkEnemy(t, c));
  items = []; parts = []; bumps = {}; camX = 0;
  resetPlayer();
}
function resetPlayer() {
  const big = P && P.big;
  P = { x: 32, y: GY - 15, w: 12, h: 15, vx: 0, vy: 0, big: false, onGround: true,
        face: 1, invul: 0, star: 0, anim: 0, coyote: 0 };
  if (big) { P.big = true; P.h = 21; P.y = GY - 21; }
}
function mkEnemy(type, col) {
  if (type === 'g') return { type, x: col * T + 1, y: GY - 14, w: 14, h: 14, vx: -0.4, vy: 0, state: 'walk', active: false, timer: 0, kick: 0 };
  return { type, x: col * T + 2, y: GY - 12, w: 12, h: 12, vx: -0.4, vy: 0, state: 'walk', active: false, timer: 0, kick: 0 };
}
function startGame() {
  lives = START_LIVES; score = 0; lvIdx = 0; P = null;
  loadLevel(0); state = 'intro'; stateT = 100; jumpBuf = 0;
}

/* =====================================================================
   7. 충돌 / 물리
   ===================================================================== */
function tile(c, r) {
  if (c < 0) return 0;
  if (c >= LV.len) return 6;            // 맵 오른쪽 끝은 벽
  if (r < 0 || r >= ROWS) return 0;
  return LV.g[r][c];
}
function moveX(e, dx) {
  e.x += dx; if (!dx) return false;
  const x0 = Math.floor(e.x / T), x1 = Math.floor((e.x + e.w - 0.001) / T);
  const y0 = Math.floor(e.y / T), y1 = Math.floor((e.y + e.h - 0.001) / T);
  for (let r = y0; r <= y1; r++) for (let c = x0; c <= x1; c++) {
    if (tile(c, r) > 0) { e.x = dx > 0 ? c * T - e.w : (c + 1) * T; return true; }
  }
  return false;
}
function moveY(e, dy) {
  e.y += dy;
  const x0 = Math.floor(e.x / T), x1 = Math.floor((e.x + e.w - 0.001) / T);
  if (dy >= 0) {                                   // 아래로 (땅에 붙음)
    const r = Math.floor((e.y + e.h) / T);
    for (let c = x0; c <= x1; c++) if (tile(c, r) > 0) { e.y = r * T - e.h; e.vy = 0; e.onGround = true; return null; }
  } else {                                         // 위로 (블록 머리 박기)
    const r = Math.floor(e.y / T); let best = -1, bd = 1e9;
    for (let c = x0; c <= x1; c++) if (tile(c, r) > 0) {
      const d = Math.abs(c * T + 8 - (e.x + e.w / 2)); if (d < bd) { bd = d; best = c; }
    }
    if (best >= 0) { e.y = (r + 1) * T; e.vy = 0; return { c: best, r }; }
  }
  return null;
}

/* =====================================================================
   8. 게임 로직
   ===================================================================== */
function spawnItem(kind, c, r) {
  items.push({ kind, x: c * T + 1, y: r * T + 2, w: 14, h: 14, vx: kind === 'm' ? 0.7 : 0.95, vy: 0, emerge: 16, onGround: false });
}
function debris(c, r) {
  [[-1.2,-4],[1.2,-4],[-0.8,-2.5],[0.8,-2.5]].forEach(([vx, vy], i) =>
    parts.push({ x: c * T + (i % 2) * 8 + 2, y: r * T + (i > 1 ? 8 : 0) + 2, vx, vy }));
}
function killEnemy(e, dir) { e.state = 'dead'; e.vy = -3.5; e.vx = dir * 0.8; }

function bump(c, r) {
  const t = LV.g[r][c];
  if (t === 3 || t === 4) { LV.g[r][c] = 5; bumps[c + ',' + r] = 10; spawnItem(t === 3 ? 'm' : 's', c, r); sfx('bump'); }
  else if (t === 2) {
    if (P.big) { LV.g[r][c] = 0; debris(c, r); addScore(50); sfx('brk'); }
    else { bumps[c + ',' + r] = 10; sfx('bump'); }
  } else sfx('bump');
  for (const e of enemies) {                       // 블록 위에 서 있는 몹은 튕겨나감
    if (e.state === 'dead' || e.state === 'squash') continue;
    if (Math.abs(e.x + e.w / 2 - (c * T + 8)) < 14 && Math.abs(e.y + e.h - r * T) < 4) { killEnemy(e, P.vx >= 0 ? 1 : -1); addScore(100); }
  }
}
function hurt() {
  if (P.invul > 0 || state !== 'play') return;
  if (P.big) { P.big = false; P.y += 6; P.h = 15; P.invul = 100; sfx('hurt'); }
  else die(false);
}
function die(pit) {
  if (state !== 'play') return;
  state = 'dying'; lives--; P.big = false; P.star = 0; P.vx = 0;
  if (pit) { dieT = 25; P.vy = 0; } else { dieT = 0; P.vy = 0; }
  sfx('die');
}
function clearLevel() {
  state = 'clear'; clearT = 0; P.vx = 0; P.vy = 0; P.star = 0;
  P.x = LV.flag * T + 7 - P.w - 1; P.face = 1;
  addScore(500); sfx('clear');
}
function nextLevel() {
  lvIdx++;
  if (lvIdx >= LEVELS.length) { state = 'win'; stateT = 120; camX = Math.max(0, LV.len * T - W); }
  else { loadLevel(lvIdx); state = 'intro'; stateT = 100; }
}

function updatePlayer() {
  const L = held('left'), Rr = held('right'), onG = P.onGround;
  const acc = onG ? 0.14 : 0.1;
  if (L && !Rr) { P.vx -= (P.vx > 0 ? acc * 2 : acc); if (P.vx < -MAX_SPEED) P.vx = -MAX_SPEED; P.face = -1; }
  else if (Rr && !L) { P.vx += (P.vx < 0 ? acc * 2 : acc); if (P.vx > MAX_SPEED) P.vx = MAX_SPEED; P.face = 1; }
  else { const fr = onG ? 0.12 : 0.03; P.vx = P.vx > 0 ? Math.max(0, P.vx - fr) : Math.min(0, P.vx + fr); }

  P.coyote = onG ? 6 : Math.max(0, P.coyote - 1);
  if (jumpBuf > 0 && P.coyote > 0) { P.vy = -JUMP_POWER; P.onGround = false; P.coyote = 0; jumpBuf = 0; sfx('jump'); }
  if (!held('jump') && P.vy < -3) P.vy = -3;       // 짧게 누르면 낮은 점프
  P.vy = Math.min(P.vy + GRAVITY, 8);              // ★ 중력

  if (moveX(P, P.vx)) P.vx = 0;
  P.onGround = false;
  const b = moveY(P, P.vy);
  if (b) bump(b.c, b.r);

  if (P.x < camX) { P.x = camX; if (P.vx < 0) P.vx = 0; }   // ★ 화면 뒤로는 못 감
  P.anim += Math.abs(P.vx);
  if (P.invul > 0) P.invul--;
  if (P.star > 0) P.star--;
  if (P.y > H + 8) die(true);
  else if (P.x + P.w > LV.flag * T + 7) clearLevel();
}

function updateCamera() {
  // ★ 고양이가 오른쪽으로 가면 화면이 따라가고, 왼쪽으로 가도 화면은 뒤로 돌아가지 않음
  const target = P.x + P.w / 2 - W * 0.42;
  if (target > camX) camX = Math.min(target, LV.len * T - W);
}

function updateEnemies() {
  for (const e of enemies) {
    if (!e.active) { if (e.x < camX + W + 24) e.active = true; else continue; }
    if (e.state === 'squash') { if (--e.timer <= 0) e.rm = true; continue; }
    if (e.state === 'dead') { e.vy += 0.35; e.y += e.vy; e.x += e.vx; if (e.y > H + 40) e.rm = true; continue; }
    e.vy = Math.min(e.vy + GRAVITY, 6);
    if (moveX(e, e.state === 'shell' ? 0 : e.vx)) { e.vx = -e.vx; if (e.state === 'shellMove') sfx('bump'); }
    e.onGround = false; moveY(e, e.vy);
    if (e.kick > 0) e.kick--;
    if (e.y > H + 20 || e.x < camX - 48) e.rm = true;

    if (e.state === 'shellMove') {                 // 굴러가는 껍질은 다른 몹을 쓰러뜨림
      for (const o of enemies) {
        if (o === e || !o.active || o.state === 'dead' || o.state === 'squash' || o.rm) continue;
        if (overlap(e, o)) { killEnemy(o, Math.sign(e.vx) || 1); addScore(200); sfx('stomp'); }
      }
    }
  }
  enemies = enemies.filter(e => !e.rm);
}

function playerVsEnemies() {
  for (const e of enemies) {
    if (!e.active || e.state === 'dead' || e.state === 'squash') continue;
    if (!overlap(P, e)) continue;
    if (P.star > 0) { killEnemy(e, P.face); addScore(200); sfx('stomp'); continue; }   // ⭐ 무적
    const stomp = P.vy > 0 && (P.y + P.h - P.vy) <= e.y + 6;
    if (e.state === 'shell') {                     // 멈춘 껍질 → 차기
      if (stomp) P.vy = -4.5;
      e.state = 'shellMove'; e.vx = (P.x + P.w / 2 < e.x + e.w / 2) ? 3 : -3; e.kick = 14;
      sfx('stomp'); addScore(100); continue;
    }
    if (stomp) {
      P.vy = -4.5; P.onGround = false; sfx('stomp'); addScore(100);
      if (e.type === 'g') { e.state = 'squash'; e.timer = 30; e.vx = 0; }
      else if (e.state === 'walk') { e.state = 'shell'; e.vx = 0; e.x -= 1; e.w = 14; e.y += 4; e.h = 8; }
      else if (e.state === 'shellMove') { e.state = 'shell'; e.vx = 0; }
      continue;
    }
    if (e.state === 'shellMove' && e.kick > 0) continue;
    hurt();
  }
}

function updateItems() {
  for (const it of items) {
    if (it.emerge > 0) { it.y -= 1; it.emerge--; continue; }
    it.vy = Math.min(it.vy + 0.3, 6);
    if (moveX(it, it.vx)) it.vx = -it.vx;
    it.onGround = false; moveY(it, it.vy);
    if (it.kind === 's' && it.onGround) it.vy = -4.6;      // 별은 통통 튀어요
    if (it.y > H + 20 || it.x < camX - 40) it.rm = true;
    if (!it.rm && overlap(P, it)) {
      it.rm = true;
      if (it.kind === 'm') {
        if (!P.big) { P.big = true; P.y -= 6; P.h = 21; sfx('power'); addScore(1000); }
        else { lives++; sfx('oneup'); addScore(1000); }        // 이미 커졌으면 기회 +1
      } else { P.star = STAR_TIME; sfx('star'); addScore(1000); }
    }
  }
  items = items.filter(i => !i.rm);
}

function updateParts() {
  for (const p of parts) { p.vy += 0.35; p.x += p.vx; p.y += p.vy; }
  parts = parts.filter(p => p.y < H + 10);
  for (const k in bumps) { if (--bumps[k] <= 0) delete bumps[k]; }
}

function update() {
  tick++;
  if (state === 'title') {
    camX = (tick * 0.5) % 900;
    if (jumpBuf > 0) startGame();
  } else if (state === 'intro') {
    if (--stateT <= 0) state = 'play';
  } else if (state === 'play') {
    updatePlayer();
    if (state === 'play') { updateCamera(); updateEnemies(); updateItems(); updateParts(); playerVsEnemies(); }
  } else if (state === 'dying') {
    dieT++;
    if (dieT === 20) P.vy = -6;
    if (dieT >= 20) { P.vy += 0.3; P.y += P.vy; }
    updateParts();
    if (dieT > 110) {
      if (lives <= 0) { state = 'over'; stateT = 90; }
      else { loadLevel(lvIdx); state = 'intro'; stateT = 80; }
    }
  } else if (state === 'clear') {
    clearT++;
    if (!P.onGround) { P.onGround = false; moveY(P, 1.6); }
    updateParts();
    if (clearT > 160) nextLevel();
  } else if (state === 'over' || state === 'win') {
    if (--stateT < 0 && jumpBuf > 0) { state = 'title'; jumpBuf = 0; loadLevel(0); }
  }
  if (jumpBuf > 0) jumpBuf--;
}

/* =====================================================================
   9. 그리기
   ===================================================================== */
function dspr(img, x, y, flip = false, flipV = false) {
  x = Math.round(x); y = Math.round(y);
  if (!flip && !flipV) { ctx.drawImage(img, x, y); return; }
  ctx.save();
  ctx.translate(x + (flip ? img.width : 0), y + (flipV ? img.height : 0));
  ctx.scale(flip ? -1 : 1, flipV ? -1 : 1);
  ctx.drawImage(img, 0, 0);
  ctx.restore();
}
const tmp = document.createElement('canvas'), tctx = tmp.getContext('2d');
function tinted(img, color) {
  tmp.width = img.width; tmp.height = img.height;
  tctx.clearRect(0, 0, tmp.width, tmp.height);
  tctx.globalCompositeOperation = 'source-over'; tctx.drawImage(img, 0, 0);
  tctx.globalCompositeOperation = 'source-atop'; tctx.globalAlpha = 0.55; tctx.fillStyle = color;
  tctx.fillRect(0, 0, tmp.width, tmp.height);
  tctx.globalAlpha = 1; tctx.globalCompositeOperation = 'source-over';
  return tmp;
}
function disc(cx, cy, r, col) {
  ctx.fillStyle = col;
  for (let dy = -r; dy <= r; dy++) { const dx = Math.floor(Math.sqrt(r * r - dy * dy)); ctx.fillRect(cx - dx, cy + dy, dx * 2, 1); }
}
function hills(cx, par, color, w, h, period, off) {
  ctx.fillStyle = color;
  const s = Math.floor(cx * par / period) - 1, n = Math.ceil(W / period) + 3;
  for (let i = s; i < s + n; i++) {
    const hx = i * period + off - cx * par;
    for (let x = 0; x < w; x += 2) {
      const d = (x - w / 2) / (w / 2), hh = Math.round(h * Math.sqrt(Math.max(0, 1 - d * d)) / 2) * 2;
      ctx.fillRect(Math.round(hx + x), GY - hh, 2, hh);
    }
  }
}
function drawBG(cx) {
  const th = THEMES[LV.theme];
  th.sky.forEach((c, i) => { ctx.fillStyle = c; ctx.fillRect(0, i * 48, W, 48); });
  if (th.stars) {
    ctx.fillStyle = '#fff';
    for (let i = 0; i < 46; i++) {
      let x = (i * 97 + i * i * 3) % W - cx * 0.05; x = ((x % W) + W) % W;
      const y = (i * 37) % 120;
      if ((tick + i * 7) % 70 < 58) ctx.fillRect(Math.floor(x), y, 1, 1);
    }
  }
  disc(th.orb.x, th.orb.y, th.orb.r, th.orb.c);
  if (LV.theme === 2) { ctx.fillStyle = '#e2d9a8'; ctx.fillRect(263, 26, 3, 3); ctx.fillRect(272, 33, 4, 3); ctx.fillRect(270, 23, 2, 2); }
  hills(cx, 0.25, th.hill2, 150, 52, 230, 40);
  hills(cx, 0.5, th.hill1, 110, 34, 170, 90);
  const cl = CLOUDS[LV.theme], par = 0.3, step = 92;
  const n = Math.ceil((LV.len * T * par + W) / step) + 2;
  for (let i = 0; i < n; i++) {
    const wx = i * step + (i * 37 % 50), wy = 12 + (i * 29 % 56);
    const sx = Math.round(wx - cx * par);
    if (sx > -30 && sx < W + 10) dspr(cl, sx, wy);
  }
}
function drawTiles(cx) {
  const c0 = Math.max(0, Math.floor(cx / T)), c1 = Math.min(LV.len - 1, Math.floor((cx + W) / T));
  for (let r = 0; r < ROWS; r++) for (let c = c0; c <= c1; c++) {
    const t = LV.g[r][c]; if (!t) continue;
    let img;
    if (t === 1) img = (r > 0 && LV.g[r - 1][c] > 0) ? T_DIRT : T_GRASS;
    else if (t === 2) img = T_BRICK; else if (t === 3 || t === 4) img = T_Q;
    else if (t === 5) img = T_USED; else img = T_STONE;
    let oy = 0; const b = bumps[c + ',' + r];
    if (b) oy = -Math.round(Math.sin(b / 10 * Math.PI) * 5);
    ctx.drawImage(img, c * T - cx, r * T + oy);
  }
}
function drawFlag(cx) {
  const x = LV.flag * T + 7 - cx;
  if (x < -20 || x > W + 20) return;
  ctx.fillStyle = '#e8eef2'; ctx.fillRect(x, 30, 2, GY - 30);
  ctx.fillStyle = '#8a97a3'; ctx.fillRect(x + 1, 30, 1, GY - 30);
  ctx.fillStyle = '#ffd23b'; ctx.fillRect(x - 1, 26, 4, 4);
  for (let i = 0; i < 12; i++) { ctx.fillStyle = '#ff5d8f'; ctx.fillRect(x - (13 - i), 34 + i, 13 - i, 1); }
  ctx.fillStyle = '#fff'; ctx.fillRect(x - 8, 37, 2, 2);
}
function drawEnemies(cx) {
  for (const e of enemies) {
    if (e.x - cx > W + 20 || e.x - cx < -30) continue;
    const mx = e.x + e.w / 2 - 8 - cx;
    if (e.type === 'g') {
      if (e.state === 'squash') {
        ctx.drawImage(GOOMBA, 0, GOOMBA.height - 6, 16, 6, Math.round(mx), Math.round(e.y + e.h - 6), 16, 6);
      } else dspr(GOOMBA, mx, e.y + e.h - GOOMBA.height, Math.floor(tick / 10) % 2 === 0, e.state === 'dead');
    } else {
      if (e.state === 'walk') dspr(KOOPA, mx, e.y + e.h - KOOPA.height, e.vx > 0);
      else if (e.state === 'dead') dspr(SHELL, mx, e.y + e.h - SHELL.height, false, true);
      else dspr(SHELL, mx, e.y + e.h - SHELL.height, e.state === 'shellMove' && Math.floor(tick / 3) % 2 === 0);
    }
  }
}
function drawPlayer(cx) {
  const set = P.big ? CAT_L : CAT_S;
  let img;
  if (state === 'dying' || !P.onGround) img = set.J;
  else if (Math.abs(P.vx) > 0.3) img = (Math.floor(P.anim / 5) % 2) ? set.B : set.A;
  else img = set.A;
  if (P.invul > 0 && Math.floor(tick / 3) % 2 && state === 'play') return;
  if (P.star > 0 && state === 'play') {
    const cols = ['#ff3b3b', '#ffd23b', '#3bff6a', '#3bd0ff', '#c63bff'];
    if (P.star > 90 || Math.floor(tick / 4) % 2) img = tinted(img, cols[Math.floor(tick / 3) % cols.length]);
  }
  dspr(img, P.x + P.w / 2 - 8 - cx, P.y + P.h - img.height, P.face < 0, state === 'dying' && dieT >= 20);
}
function hud() {
  txt('LV' + (lvIdx + 1), 8, 6, 2);
  txt('SCORE ' + String(score).padStart(6, '0'), 62, 6, 2);
  const t = 'X' + lives, w = txt(t, W - 8, 6, 2, '#fff', 'r');
  ctx.drawImage(CAT_S.A, 8, 0, 8, 8, W - 8 - w - 12, 5, 8, 8);
  if (P.star > 0) {
    ctx.fillStyle = '#000'; ctx.fillRect(8, 21, 42, 5);
    ctx.fillStyle = ['#ff3b3b', '#ffd23b', '#3bff6a', '#3bd0ff'][Math.floor(tick / 4) % 4];
    ctx.fillRect(9, 22, Math.round(40 * P.star / STAR_TIME), 3);
    ctx.drawImage(STAR, 0, 0, 16, 14, 54, 15, 11, 10);
  }
}
const dim = a => { ctx.fillStyle = 'rgba(0,0,0,' + a + ')'; ctx.fillRect(0, 0, W, H); };
const blink = () => Math.floor(tick / 30) % 2 === 0;

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (state === 'intro') {
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    txt('LV ' + (lvIdx + 1), W / 2, 56, 5, '#fff', 'c');
    ctx.drawImage(CAT_S.A, W / 2 - 36, 112 - 8, 16, 16, W / 2 - 36, 104, 16, 16);
    txt('X ' + lives, W / 2 - 10, 106, 3);
    txt(['DAY', 'SUNSET', 'NIGHT'][lvIdx], W / 2, 148, 2, '#9b97e0', 'c');
    return;
  }
  const cx = Math.round(camX);
  drawBG(cx);
  items.forEach(it => dspr(it.kind === 'm' ? MUSHROOM : STAR, it.x + it.w / 2 - 8 - cx, it.y + it.h - (it.kind === 'm' ? MUSHROOM.height : STAR.height), false));
  drawTiles(cx);
  drawFlag(cx);
  if (state !== 'title') drawEnemies(cx);
  if (state !== 'title') drawPlayer(cx);
  ctx.fillStyle = '#d2692f';
  parts.forEach(p => { ctx.fillRect(Math.round(p.x - cx), Math.round(p.y), 4, 4); ctx.fillStyle = '#6e2f12'; ctx.fillRect(Math.round(p.x - cx), Math.round(p.y), 4, 1); ctx.fillStyle = '#d2692f'; });

  if (state === 'title') {
    dim(0.25);
    txt('CAT MARIO', W / 2, 30, 4, '#ffd23b', 'c');
    ctx.save(); ctx.translate(W / 2 - 24, 78 + Math.round(Math.sin(tick / 12) * 3)); ctx.scale(3, 3);
    ctx.drawImage(CAT_S.A, 0, 0); ctx.restore();
    if (blink()) txt('PRESS JUMP TO START', W / 2, 148, 2, '#fff', 'c');
  } else {
    hud();
    if (state === 'clear' && clearT > 25) txt('LEVEL CLEAR!', W / 2, 70, 3, '#ffd23b', 'c');
    if (state === 'over') {
      dim(0.55); txt('GAME OVER', W / 2, 62, 4, '#ff5d6f', 'c');
      txt('SCORE ' + String(score).padStart(6, '0'), W / 2, 106, 2, '#fff', 'c');
      if (stateT < 0 && blink()) txt('PRESS JUMP', W / 2, 140, 2, '#fff', 'c');
    }
    if (state === 'win') {
      dim(0.5); txt('YOU WIN!', W / 2, 40, 4, '#ffd23b', 'c');
      ctx.save(); ctx.translate(W / 2 - 24, 80 - Math.abs(Math.round(Math.sin(tick / 8) * 10))); ctx.scale(3, 3);
      ctx.drawImage(CAT_S.A, 0, 0); ctx.restore();
      txt('SCORE ' + String(score).padStart(6, '0'), W / 2, 134, 2, '#fff', 'c');
      if (stateT < 0 && blink()) txt('PRESS JUMP', W / 2, 160, 2, '#fff', 'c');
    }
  }
}

/* =====================================================================
   10. 메인 루프 (1초에 60번 업데이트)
   ===================================================================== */
loadLevel(0);
let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
